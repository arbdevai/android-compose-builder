<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d0f"/>
      <stop offset="50%" stop-color="#12161a"/>
      <stop offset="100%" stop-color="#0e1215"/>
    </linearGradient>

    <radialGradient id="neonGlowLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ccff00" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="neonGlowRight" cx="85%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#3ddc84" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ccff00" stop-opacity="0"/>
    </radialGradient>

    <!-- Lime Gradients -->
    <linearGradient id="limeTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ccff00"/>
      <stop offset="100%" stop-color="#3ddc84"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182026" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#101519" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#3ddc84" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern: Architectural Grid -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232c33" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#ccff00" fill-opacity="0.25"/>
    </pattern>

    <pattern id="dotMatrix" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#475569" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glows -->
  <rect width="1200" height="420" rx="16" fill="url(#neonGlowLeft)"/>
  <rect width="1200" height="420" rx="16" fill="url(#neonGlowRight)"/>

  <!-- Blueprint & Engineering Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#techGrid)"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#limeTextGrad)"/>
  <line x1="160" y1="3" x2="340" y2="3" stroke="#ccff00" stroke-width="3" filter="url(#subtleBlur)"/>

  <!-- Matrix Dot Overlay on Right Side -->
  <rect x="700" y="40" width="460" height="340" fill="url(#dotMatrix)" opacity="0.7"/>

  <!-- Architectural Corner Crosshairs & Tech Marks -->
  <g stroke="#ccff00" stroke-width="1.2" opacity="0.65">
    <!-- Top-Left Cross -->
    <path d="M 32 24 L 32 40 M 24 32 L 40 32"/>
    <!-- Top-Right Cross -->
    <path d="M 1168 24 L 1168 40 M 1160 32 L 1176 32"/>
    <!-- Bottom-Left Cross -->
    <path d="M 32 380 L 32 396 M 24 388 L 40 388"/>
    <!-- Bottom-Right Cross -->
    <path d="M 1168 380 L 1168 396 M 1160 388 L 1176 388"/>
  </g>

  <!-- Technical Coordinate Label -->
  <g font-family="ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="10" fill="#64748b" letter-spacing="1.5">
    <text x="56" y="36">STD // AOSP-KTX-SPEC // REV 3.8.2</text>
    <text x="1010" y="36" text-anchor="end">SYS.REF: #00E676:CCFF00</text>
  </g>

  <!-- ================= LEFT CONTENT: BRAND & TYPOGRAPHY ================= -->

  <!-- Google Dev Tag / Category Badge -->
  <g transform="translate(56, 72)">
    <rect width="268" height="26" rx="6" fill="#182218" stroke="#ccff00" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="13" r="4" fill="#ccff00" filter="url(#subtleBlur)"/>
    <text x="28" y="17" font-family="ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#ccff00" letter-spacing="1">
      GOOGLE DEV AGENT SPEC
    </text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(56, 150)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="url(#titleGrad)" letter-spacing="-1">
      Android Compose <tspan fill="url(#limeTextGrad)">Builder</tspan>
    </text>
  </g>

  <!-- Subtitle / Mission Statement -->
  <g transform="translate(56, 186)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16.5" fill="#94a3b8" letter-spacing="-0.2">
      Industrial-Grade Kotlin Multiplatform &amp; Jetpack Compose Agent Skill
    </text>
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14.5" fill="#64748b" letter-spacing="0.1">
      Engineered for Zero-CI-Failure, Streaming Updaters, Mutex Concurrency &amp; Shimmer Skeletons
    </text>
  </g>

  <!-- Feature Pills / Specification Chips -->
  <g transform="translate(56, 256)">
    <!-- Pill 1: Jetpack Compose Material3 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="8" fill="#13191e" stroke="#25323c" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#ccff00"/>
      <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
        Material3 &amp; Shimmer
      </text>
    </g>

    <!-- Pill 2: Resilient Coroutines -->
    <g transform="translate(192, 0)">
      <rect width="180" height="34" rx="8" fill="#13191e" stroke="#25323c" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#3ddc84"/>
      <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
        Mutex &amp; Anti-Deadlock
      </text>
    </g>

    <!-- Pill 3: OkHttp Streaming In-App Update -->
    <g transform="translate(384, 0)">
      <rect width="206" height="34" rx="8" fill="#13191e" stroke="#25323c" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#ccff00"/>
      <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
        Stream Updater &amp; .part
      </text>
    </g>

    <!-- Pill 4: Zero-CI-Failure Linter -->
    <g transform="translate(0, 44)">
      <rect width="180" height="34" rx="8" fill="#13191e" stroke="#25323c" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="3.5" fill="#ccff00"/>
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">
        Zero-CI Pre-Flight
      </text>
    </g>

    <!-- Pill 5: Keystore Automation -->
    <g transform="translate(192, 44)">
      <rect width="180" height="34" rx="8" fill="#13191e" stroke="#25323c" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="3.5" fill="#3ddc84"/>
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">
        1-Click Release Sign
      </text>
    </g>

    <!-- Pill 6: Zero Dummy Data -->
    <g transform="translate(384, 44)">
      <rect width="206" height="34" rx="8" fill="#13191e" stroke="#25323c" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="3.5" fill="#ccff00"/>
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">
        Authentic Cloud APIs
      </text>
    </g>
  </g>

  <!-- Monospace Command Preview Bar -->
  <g transform="translate(56, 360)">
    <rect width="590" height="32" rx="6" fill="#090c0e" stroke="#1f2830" stroke-width="1"/>
    <text x="14" y="20" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ccff00" font-weight="700">$</text>
    <text x="30" y="20" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#94a3b8">curl -fsSL https://raw.githubusercontent.com/arbdevai/android-compose-builder/main/install.sh | bash</text>
  </g>

  <!-- ================= RIGHT CONTENT: HERO JETPACK COMPOSE & ANDROID SCHEMATIC ================= -->

  <!-- Outer Isometric / Hexagonal Accent Shield -->
  <g transform="translate(940, 215)">
    <!-- Ambient Neon Orbit Ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#202a33" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#ccff00" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="12 24"/>
    
    <!-- Rotating Node Markers -->
    <circle cx="140" cy="0" r="4" fill="#ccff00" filter="url(#subtleBlur)"/>
    <circle cx="-140" cy="0" r="3" fill="#3ddc84"/>
    <circle cx="0" cy="-140" r="3.5" fill="#ccff00"/>
    <circle cx="0" cy="140" r="3" fill="#3ddc84"/>

    <!-- Decorative Circuit / Blueprint Paths -->
    <path d="M -110 -110 L -140 -140 L -210 -140" fill="none" stroke="#ccff00" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <circle cx="-210" cy="-140" r="3" fill="#ccff00" opacity="0.6"/>
    <text x="-218" y="-148" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#ccff00" opacity="0.8" text-anchor="end">@Composable UI</text>

    <path d="M 110 110 L 140 140 L 200 140" fill="none" stroke="#3ddc84" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <circle cx="200" cy="140" r="3" fill="#3ddc84" opacity="0.6"/>
    <text x="208" y="144" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#3ddc84" opacity="0.8">StateFlow&lt;T&gt;</text>

    <!-- Center Card Panel: Glassmorphic Engineering Console -->
    <rect x="-115" y="-115" width="230" height="230" rx="28" fill="url(#cardGrad)" stroke="url(#strokeGrad)" stroke-width="2"/>
    
    <!-- Inner Glowing Accent Line -->
    <rect x="-95" y="-95" width="190" height="190" rx="20" fill="none" stroke="#ccff00" stroke-width="0.75" stroke-opacity="0.2"/>

    <!-- Stylized Android Head + Jetpack Compose Spiral Core -->
    <g transform="translate(0, -12)">
      <!-- Android Head Dome -->
      <path d="M -46 8 A 46 46 0 0 1 46 8 Z" fill="#0d1317" stroke="#ccff00" stroke-width="3" filter="url(#subtleBlur)"/>
      <path d="M -46 8 A 46 46 0 0 1 46 8 Z" fill="#131b20" stroke="#ccff00" stroke-width="2"/>

      <!-- Android Antennae -->
      <line x1="-28" y1="-24" x2="-38" y2="-44" stroke="#ccff00" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="28" y1="-24" x2="38" y2="-44" stroke="#ccff00" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Android Eyes (Neon Glowing Lime) -->
      <circle cx="-20" cy="-6" r="4.5" fill="#ccff00" filter="url(#subtleBlur)"/>
      <circle cx="20" cy="-6" r="4.5" fill="#ccff00" filter="url(#subtleBlur)"/>
      <circle cx="-20" cy="-6" r="2" fill="#ffffff"/>
      <circle cx="20" cy="-6" r="2" fill="#ffffff"/>

      <!-- Jetpack Compose Reactive Symbol Below Head -->
      <g transform="translate(0, 36)">
        <!-- Layer 1: Outermost Compose Bracket Shape -->
        <path d="M -38 0 L -18 -18 L 18 -18 L 38 0 L 18 18 L -18 18 Z" fill="none" stroke="#2a3945" stroke-width="2"/>
        
        <!-- Layer 2: Middle Interlocking Lime Ring -->
        <path d="M -26 0 L -12 -12 L 12 -12 L 26 0 L 12 12 L -12 12 Z" fill="#18231c" stroke="#3ddc84" stroke-width="2"/>

        <!-- Layer 3: Central Neon Nucleus -->
        <circle cx="0" cy="0" r="6" fill="#ccff00" filter="url(#neonBlur)"/>
        <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      </g>
    </g>

    <!-- Technical Status Badge Under Robot -->
    <g transform="translate(0, 78)">
      <rect x="-65" y="0" width="130" height="22" rx="11" fill="#0c1013" stroke="#ccff00" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="-48" cy="11" r="3" fill="#ccff00" filter="url(#subtleBlur)"/>
      <text x="-36" y="14.5" font-family="ui-monospace, Menlo, monospace" font-size="9" font-weight="700" fill="#ccff00" letter-spacing="1">
        KOTLIN 2.0+
      </text>
    </g>
  </g>

  <!-- Subtle Outer Border for Container -->
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="15.25" fill="none" stroke="#26333d" stroke-width="1.5"/>
</svg>
