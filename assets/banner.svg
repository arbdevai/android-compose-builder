<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" fill="none">
  <!-- Clean Charcoal Solid Matte Canvas -->
  <rect width="1200" height="400" rx="12" fill="#0C0F12"/>
  <rect x="1" y="1" width="1198" height="398" rx="11" fill="none" stroke="#1C242C" stroke-width="1.5"/>

  <!-- Minimalist Technical Accent Line (Lime Neon) -->
  <rect x="0" y="0" width="1200" height="3" fill="#CCFF00"/>

  <!-- Subtle Blueprint Grid (Precise & Clean, No Gradients) -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#161D24" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="12" fill="url(#grid)" opacity="0.75"/>

  <!-- Corner Alignment Crosshairs -->
  <g stroke="#CCFF00" stroke-width="1" opacity="0.4">
    <path d="M 28 20 L 28 36 M 20 28 L 36 28"/>
    <path d="M 1172 20 L 1172 36 M 1164 28 L 1180 28"/>
    <path d="M 28 364 L 28 380 M 20 372 L 36 372"/>
    <path d="M 1172 364 L 1172 380 M 1164 372 L 1180 372"/>
  </g>

  <!-- ================= LEFT: REPO IDENTITY & VALUE PROPOSITION ================= -->

  <!-- Top Monospace Label -->
  <g transform="translate(64, 52)">
    <rect width="288" height="24" rx="4" fill="#141B1F" stroke="#CCFF00" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="12" cy="12" r="3.5" fill="#CCFF00"/>
    <text x="24" y="16" font-family="ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#CCFF00" letter-spacing="1">
      GOOGLE DEV AGENT SPEC // CLOUD CI
    </text>
  </g>

  <!-- Main Hero Title (Flat, High Legibility, No Messy Gradients) -->
  <text x="64" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="#FFFFFF" letter-spacing="-0.8">
    Android Compose <tspan fill="#CCFF00">Builder</tspan>
  </text>

  <!-- Core Value Proposition Statement -->
  <text x="64" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#E2E8F0" letter-spacing="-0.2">
    Bikin APK Android Modern Tanpa Build Lokal — 100% Cloud CI via GitHub Actions
  </text>

  <text x="64" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#8899A6">
    Tulis kode Kotlin + Jetpack Compose, verifikasi pre-flight mandiri, lalu biarkan GitHub yang kompilasi &amp; merilis signed APK.
  </text>

  <!-- Architectural Feature Matrix (Matte Charcoal Panels + Neon Lime Dot) -->
  <g transform="translate(64, 226)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="250" height="64" rx="6" fill="#11161B" stroke="#1D2630" stroke-width="1"/>
      <circle cx="20" cy="24" r="3" fill="#CCFF00"/>
      <text x="32" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">
        Zero Local Build
      </text>
      <text x="32" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#788896">
        Bebas beban Gradle daemon &amp; RAM
      </text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(266, 0)">
      <rect width="250" height="64" rx="6" fill="#11161B" stroke="#1D2630" stroke-width="1"/>
      <circle cx="20" cy="24" r="3" fill="#CCFF00"/>
      <text x="32" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">
        GitHub Actions CI/CD
      </text>
      <text x="32" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#788896">
        Kompilasi headless runner di cloud
      </text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 76)">
      <rect width="250" height="64" rx="6" fill="#11161B" stroke="#1D2630" stroke-width="1"/>
      <circle cx="20" cy="24" r="3" fill="#CCFF00"/>
      <text x="32" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">
        Auto-Signed Keystore
      </text>
      <text x="32" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#788896">
        1-Click GitHub Secrets signing
      </text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(266, 76)">
      <rect width="250" height="64" rx="6" fill="#11161B" stroke="#1D2630" stroke-width="1"/>
      <circle cx="20" cy="24" r="3" fill="#CCFF00"/>
      <text x="32" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">
        Streaming In-App Updater
      </text>
      <text x="32" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#788896">
        OkHttp .part &amp; deep DEX validation
      </text>
    </g>
  </g>

  <!-- ================= RIGHT: INDUSTRIAL WORKFLOW SCHEMATIC ================= -->

  <!-- Workflow Pipeline Container -->
  <g transform="translate(630, 48)">
    <rect width="506" height="304" rx="8" fill="#101519" stroke="#1D2730" stroke-width="1.2"/>
    
    <!-- Header of Schematic -->
    <rect x="0" y="0" width="506" height="34" rx="8" fill="#141B21"/>
    <path d="M 0 34 L 506 34" stroke="#1D2730" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#E11D48" opacity="0.7"/>
    <circle cx="32" cy="17" r="4" fill="#FBBF24" opacity="0.7"/>
    <circle cx="46" cy="17" r="4" fill="#22C55E" opacity="0.7"/>
    <text x="64" y="21" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#8899A6" font-weight="600">
      WORKFLOW PIPELINE: ZERO LOCAL BUILD
    </text>

    <!-- Step 1: Local Coding & Pre-Flight -->
    <g transform="translate(24, 52)">
      <rect width="458" height="60" rx="6" fill="#0C1013" stroke="#222D38" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="60" rx="2" fill="#CCFF00"/>
      <text x="18" y="24" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700" fill="#CCFF00">
        STEP 01: LOCAL WORKSPACE (RINGAN &amp; CEPAT)
      </text>
      <text x="18" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">
        Tulis Jetpack Compose &amp; jalankan pre-flight linter: <tspan font-family="ui-monospace, monospace" fill="#CCFF00">verify_kotlin_syntax.py</tspan>
      </text>
    </g>

    <!-- Connecting Directional Arrow 1 -->
    <g transform="translate(253, 118)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#CCFF00" stroke-width="1.5" stroke-dasharray="3 3"/>
      <polygon points="-4,12 4,12 0,18" fill="#CCFF00"/>
    </g>

    <!-- Step 2: Git Push to Main -->
    <g transform="translate(24, 138)">
      <rect width="458" height="60" rx="6" fill="#0C1013" stroke="#222D38" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="60" rx="2" fill="#CCFF00"/>
      <text x="18" y="24" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700" fill="#CCFF00">
        STEP 02: GIT PUSH TO REPO (DELEGASI CLOUD)
      </text>
      <text x="18" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">
        Commit dengan prefix <tspan font-family="ui-monospace, monospace" fill="#FFFFFF">"Release v..."</tspan> &amp; push via GitHub token aman
      </text>
    </g>

    <!-- Connecting Directional Arrow 2 -->
    <g transform="translate(253, 204)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#CCFF00" stroke-width="1.5" stroke-dasharray="3 3"/>
      <polygon points="-4,12 4,12 0,18" fill="#CCFF00"/>
    </g>

    <!-- Step 3: GitHub Actions Cloud Build -->
    <g transform="translate(24, 224)">
      <rect width="458" height="60" rx="6" fill="#131C14" stroke="#CCFF00" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="0" y="0" width="4" height="60" rx="2" fill="#CCFF00"/>
      <text x="18" y="24" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700" fill="#CCFF00">
        STEP 03: GITHUB ACTIONS RUNNER (PRODUKSI)
      </text>
      <text x="18" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#E2E8F0">
        Kompilasi Gradle di cloud, signing APK otomatis &amp; publish GitHub Release
      </text>
    </g>
  </g>
</svg>
